# Parameters of the object_detection_lidar_node
object_detection_lidar_node:
  ros__parameters:
    # Topics
    scan_subscriber: "/scan"
    points_publisher: "/object_detection_lidar/points"
    markers_publisher: "/object_detection_lidar/markers"
    # One point per object (centroid) with the fields extent_x, extent_y, diameter
    # and is_box (1.0 box, 0.0 other), input of the fusion
    objects_publisher: "/object_detection_lidar/objects"

    # Valid range of the scan points (additionally limited by the sensor itself)
    min_range: 0.15 # in m, closer points are ignored (e.g. car body)
    max_range: 4.0 # in m, farther points are ignored

    # Clustering (DBSCAN)
    # Max. distance of two neighboring points of the same object. The RPLIDAR A2M12
    # has an angle_increment of 0.00348 rad, i.e. ~14 mm point spacing at 4 m.
    # eps is clearly above that (plus measurement noise) and clearly below the
    # min. distance of 1 m between obstacles, so two obstacles are not merged.
    # The 1 m only applies along the track, obstacles can stand closer when
    # parallel parking and may then be merged.
    eps: 0.10 # in m
    # Min. number of points in the neighborhood of a core point (incl. itself),
    # single outliers are treated as noise
    min_samples: 3
    # Objects with a larger diameter (largest distance of two points, independent
    # of the rotation) are dropped (simple wall filter). CAuDri only specifies the
    # width of obstacles (100 to 400 mm), the length is open. 0.6 m is a
    # preliminary value and still has to be justified.
    max_object_diameter: 0.6 # in m

    # Box classification (is_box), see box_classification.py
    # Max. RMS distance of the points to a box side: box_line_tolerance at 0 m plus
    # box_line_tolerance_per_m per m of distance. The range noise of the A2M12 in the
    # rosbags of 03/11/2026 grows with the distance (median ~0.4 mm + 1.4 mm/m,
    # 90th percentile ~2.7 mm/m). A larger value (2.5 mm/m) finds more frontal boxes
    # at 3-4 m, but in hand-labelled scans of these rosbags it added 2 true boxes and
    # 24 false ones (straight edges of furniture and walls), so 1.5 mm/m is kept.
    box_line_tolerance: 0.0023 # in m
    box_line_tolerance_per_m: 0.0015 # in m/m
    # Max. deviation of a corner from 90°
    box_angle_tolerance: 10.0 # in deg
    # Factor on the line tolerance for the sides of a corner (a right angle rarely
    # occurs by chance, so the sides may be noisier)
    box_corner_tolerance_factor: 2.5
    # Min. distance between the outermost points, below the min. obstacle width of
    # 0.1 m (CAuDri), small fragments are almost always straight
    box_min_size: 0.08 # in m
    # Min. ratio of points to beams within the angular span, a box is a closed
    # surface (drops sparse clusters like chair legs)
    box_min_fill_ratio: 0.7

    # Region of interest: only objects whose centroid lies in a fixed rectangle
    # around the vehicle are kept and classified. All valid points are clustered
    # first and the wall filter runs on the complete objects, because clipping the
    # points would cut barriers and walls at the border into short straight pieces
    # that pass the wall filter as boxes. The objects are still published in the
    # laser frame. The rectangle
    # is given in the vehicle frame (x forward, y left) with the origin at the
    # center of the LiDAR (the offset to the vehicle origin is not known yet). It
    # covers the area behind and next to the vehicle on purpose (360° view, unlike
    # the camera): merging back after overtaking, parking spots, crossing traffic.
    # It does not follow curves (see README).
    # Yaw of the laser frame in the vehicle frame (like a tf base_link -> laser):
    # p_vehicle = R(laser_yaw) * p_laser. In the rosbags of 03/11/2026 the vehicle
    # moves along -y of the laser frame and +x points to the left (ego motion by
    # ICP, turn direction checked against the camera), i.e. 90°.
    laser_yaw: 90.0 # in deg
    # Behind the vehicle: after overtaking the vehicle merges back within 2 m
    # (CAuDri), the overtaken obstacle has to stay visible behind it
    roi_x_min: -1.5 # in m
    # Ahead of the vehicle, within max_range
    roi_x_max: 3.0 # in m
    # Right: half of the own lane (lanes 350-450 mm wide, CAuDri), the parking
    # strip on the right (~300 mm) and a margin
    roi_y_min: -0.8 # in m
    # Left: half of the own lane, the opposite lane (up to 450 mm), cross parking
    # spots on the left (~500 mm) and a margin
    roi_y_max: 1.6 # in m
    # false keeps all objects (behavior without region of interest)
    roi_enabled: true
