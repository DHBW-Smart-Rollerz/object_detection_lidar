# Parameters of the object_detection_lidar_node
object_detection_lidar_node:
  ros__parameters:
    # Topics
    scan_subscriber: "/scan"
    points_publisher: "/object_detection_lidar/points"
    markers_publisher: "/object_detection_lidar/markers"
    # One point per object (centroid) with the fields extent_x, extent_y,
    # diameter, is_box (1.0 box, 0.0 other) and the endpoints left_x, left_y,
    # right_x, right_y and their distance width, all in m in the vehicle frame
    # (frame_id "vehicle"); points and markers stay in the laser frame
    objects_publisher: "/object_detection_lidar/objects"
    # Objects in the format of the camera (/object_detection/object), input of the
    # fusion: Float32MultiArray, 6 values per object [cls, BLx, BLy, BRx, BRy,
    # score] in mm in the vehicle frame, cls -1 (unknown), score 1.0
    object_publisher: "/object_detection_lidar/object"

    # Valid range of the scan points (additionally limited by the sensor itself)
    min_range: 0.15 # in m, closer points are ignored (e.g. car body)
    max_range: 4.0 # in m, farther points are ignored

    # Segmentation of the points into objects
    # "abd": adaptive breakpoint detection on the ordered scan. All valid points
    #   are walked in the order of their beams (around the full circle) and split
    #   at jumps in depth or gaps of foreign beams (breakpoint_* below). Beams
    #   without a return can count as a gap (breakpoint_count_invalid). Segments
    #   with fewer than min_samples points are noise, eps is not used.
    # "dbscan_abd" (optional): DBSCAN (eps, min_samples) first, then the clusters
    #   are split at breakpoints with the same breakpoint_* parameters.
    segmentation: "abd"

    # Clustering (DBSCAN, only with segmentation "dbscan_abd")
    # Max. distance of two neighboring points of the same object. The RPLIDAR A2M12
    # has an angle_increment of 0.00348 rad, i.e. ~14 mm point spacing at 4 m.
    # eps is clearly above that (plus measurement noise) and below the min.
    # distance between obstacles along the track.
    eps: 0.10 # in m
    # Min. number of points of an object (DBSCAN: in the neighborhood of a core
    # point incl. itself, abd: of a segment), single outliers are noise
    min_samples: 3

    # Breakpoint detection (breakpoint_detection.py), Adaptive Breakpoint Detector
    # of Borges & Aldon (2004). Consecutive points (by beam) are split if their
    # distance is above D_max = r * sin(dphi) / sin(lambda - dphi) + 3 * sigma_r
    # or if more than breakpoint_max_beam_gap foreign beams lie between them.
    # With "dbscan_abd" it splits the DBSCAN clusters (DBSCAN merges two
    # obstacles closer than eps, although the beams between them hit the
    # background), pieces with fewer than min_samples points become noise.
    # Only with "dbscan_abd": false keeps the DBSCAN clusters unsplit
    breakpoint_enabled: true
    # Smallest angle of incidence of a surface that is not split, value of
    # Borges & Aldon (2004)
    breakpoint_lambda_deg: 10.0 # in deg
    # Range noise term of the adaptive breakpoint threshold. Chosen coarse on
    # purpose: besides random noise the triangulation sensor shows local systematic
    # range errors on flat faces, smaller values over-split objects into pieces.
    breakpoint_sigma_r: 0.05 # in m
    # Max. number of foreign beams (background, other objects, noise and, with
    # breakpoint_count_invalid, beams without a return) between two consecutive
    # points of one object. Single stray returns at the edges or inside an object
    # (mixed pixels, noise) are bridged, larger gaps separate two objects.
    breakpoint_max_beam_gap: 2
    # true: beams without a return (inf, nan) count as foreign beams, so a gap
    # between two obstacles is found even if the background is out of range.
    # false bridges them (dark or shiny spots on an obstacle do not split it).
    breakpoint_count_invalid: true
    # Objects with a larger diameter (largest distance of two points, independent
    # of the rotation) are dropped (simple wall filter). CAuDri only specifies the
    # width of obstacles (100 to 400 mm), the length is open.
    max_object_diameter: 0.6 # in m

    # Box classification (is_box), see box_classification.py
    # Max. RMS distance of the points to a box side: box_line_tolerance at 0 m plus
    # box_line_tolerance_per_m per m of distance (the range noise grows with the
    # distance). Larger values find more frontal boxes far away, but also accept
    # straight edges of other objects and walls as boxes.
    box_line_tolerance: 0.0023 # in m
    box_line_tolerance_per_m: 0.0015 # in m/m
    # Max. deviation of a corner from 90°
    box_angle_tolerance: 10.0 # in deg
    # Factor on the line tolerance for the sides of a corner (a right angle rarely
    # occurs by chance, so the sides may be noisier)
    box_corner_tolerance_factor: 2.5
    # Min. distance between the outermost points, below the min. obstacle width of
    # 0.1 m (CAuDri), small fragments are almost always straight
    box_min_size: 0.08 # in m
    # Min. ratio of points to beams within the angular span, a box is a closed
    # surface (drops sparse clusters like chair legs)
    box_min_fill_ratio: 0.7

    # Vehicle frame of the camera objects (camera_preprocessing): x forward,
    # y left, origin at the center of the front axle on the ground.
    # p_vehicle = R(laser_yaw) * p_laser + (lidar_offset_x, lidar_offset_y)
    # Yaw of the laser frame in the vehicle frame (like a tf base_link -> laser).
    # The vehicle moves along -y of the laser frame and +x points to the left,
    # i.e. 90°.
    laser_yaw: 90.0 # in deg
    # Position of the center of the LiDAR in the vehicle frame. With 0.0 the
    # positions are relative to the LiDAR, not to the front axle, so the endpoints
    # of LiDAR and camera are shifted by this offset against each other.
    lidar_offset_x: 0.0 # in m
    lidar_offset_y: 0.0 # in m

    # Region of interest: only objects whose centroid lies in a rectangle in the
    # vehicle frame (see above) are kept and classified. The rectangle covers the
    # track and its near surroundings ahead of and next to the vehicle (e.g. an
    # obstacle being overtaken), objects away from the track are dropped. All valid points are segmented first and the filter runs
    # on the complete objects, so objects at the border are not cut into pieces.
    roi_x_min: -0.5 # in m, rear edge
    roi_x_max: 3.0 # in m, front edge
    roi_y_min: -1.75 # in m, right edge
    roi_y_max: 3.0 # in m, left edge
    # true keeps only the objects in the rectangle, false keeps all objects
    roi_enabled: true

    # Round objects (shape.py, is_round): all obstacles of the CAuDri track,
    # including the pedestrian figures, are angular boxes. Round contours come
    # from legs of people next to the track, bottles or chair legs. An object that
    # is no box (is_box) is dropped if a circle fits its visible contour clearly
    # better than a line and a corner. The dropped objects are published neither
    # on object_publisher nor on objects_publisher, only as gray markers (namespace
    # "round") for debugging. All criteria must hold, otherwise the object is kept
    # (recall first). The noise of the fits is box_line_tolerance +
    # box_line_tolerance_per_m * distance (see above).
    # false keeps round objects (behavior without this filter)
    drop_round_objects: true
    # Min. number of points. A circle has 3 parameters, two lines 4 plus the
    # corner, with few points the corner of a small far box fits a circle as well
    # as two lines. A cylinder of 100 mm has 12 points up to ~2.5 m, one of
    # 150 mm up to ~3.5 m, farther ones are kept.
    round_min_points: 12
    # Max. radius in m, legs, bottles and chair legs are smaller. The sides of
    # boxes and walls fit large circles.
    round_max_radius: 0.15 # in m
    # Min. visible arc seen from the center. A cylinder shows a wide arc (the
    # grazing ends return nothing), a slightly curved or noisy straight side fits
    # a short arc of a large circle.
    round_min_arc_deg: 60.0 # in deg
    # Max. RMS of the circle as multiple of the noise
    round_max_circle_rms_factor: 1.5
    # Min. ratio of the line RMS to the circle RMS
    round_min_line_ratio: 2.0
    # Min. ratio of the corner RMS (best split into two lines) to the circle RMS.
    # Two lines approximate a cylinder well, the corners of angular objects fit
    # clearly better than a circle.
    round_min_corner_ratio: 0.8
    # A corner whose lines are at 90° ± round_right_angle_tolerance needs a
    # corner RMS of round_min_right_corner_ratio times the circle RMS. The two
    # lines through a cylinder are clearly below 90°, through the corner of a
    # small far box close to 90° with about the same RMS as the circle. Close
    # cylinders with a wider visible arc reach ~90°, but their corner RMS is
    # clearly larger than the circle RMS.
    round_right_angle_tolerance: 15.0 # in deg
    round_min_right_corner_ratio: 1.5
